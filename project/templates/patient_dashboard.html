<!DOCTYPE html>
<html>
<head>
    <title>CareFlow - Patient Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #fcfbf7; color: #4a5d4e; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #8fb996; padding-bottom: 10px; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .stat-box { text-align: center; padding: 20px; margin-bottom: 20px; border-radius: 10px; background: #f0f4f1; }
        .stat-value { font-size: 36px; font-weight: bold; color: #8fb996; }
        #explanation { font-size: 14px; line-height: 1.6; color: #666; }
        .alert-active { background: #ffebee; color: #c62828; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.7; } }
    </style>
</head>
<body>
    <div class="header">
        <h2>Patient Monitoring: {{ patient_id }}</h2>
        <a href="/" style="color: #8fb996; text-decoration: none; font-weight: bold;">Logout</a>
    </div>

    <div class="grid">
        <div class="card">
            <canvas id="glucoseChart" height="150"></canvas>
        </div>
        <div>
            <div class="card stat-box" id="statusBox">
                <div style="font-size: 14px; text-transform: uppercase;">Current Glucose</div>
                <div class="stat-value" id="currVal">--</div>
                <div style="font-size: 12px; color: #888;">mg/dL</div>
            </div>
            <div class="card">
                <h3>XAI Explanation (SHAP)</h3>
                <div id="explanation">Waiting for model inference...</div>
            </div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('glucoseChart').getContext('2d');
        let rowIdx = 0;
        const chart = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'Glucose Levels', data: [], borderColor: '#8fb996', tension: 0.4 }] },
            options: { scales: { y: { min: 40, max: 300 } } }
        });

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(utterance);
        }

        async function updateData() {
            const response = await fetch(`/get-data/{{ patient_id }}/${rowIdx}`);
            const data = await response.json();

            document.getElementById('currVal').innerText = data.current;
            
            // SHAP Explanation Logic
            const impact = data.explanation.trend_impact > 0 ? "rising trend" : "declining trend";
            document.getElementById('explanation').innerHTML = `
                <b>Prediction:</b> ${data.prediction} mg/dL<br>
                <b>AI Logic:</b> The model is heavily influenced by the <b>${impact}</b> 
                (Impact Score: ${data.explanation.trend_impact}).
            `;

            // Safety Alerts
            const box = document.getElementById('statusBox');
            if(data.current > 180 || data.current < 70) {
                box.classList.add('alert-active');
                if(rowIdx % 5 === 0) speak(`Warning. Glucose level is ${data.current}. Action may be required.`);
            } else {
                box.classList.remove('alert-active');
            }

            // Update Chart
            chart.data.labels.push(rowIdx);
            chart.data.datasets[0].data.push(data.current);
            if(chart.data.labels.length > 20) {
                chart.data.labels.shift();
                chart.data.datasets[0].data.shift();
            }
            chart.update();
            rowIdx++;
        }

        setInterval(updateData, 2000);
    </script>
</body>
</html>
